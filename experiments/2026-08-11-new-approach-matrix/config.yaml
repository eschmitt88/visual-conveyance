# Inputs, hyperparameters, seeds for this experiment.
seed: 42

# Matrix definition — approach specs (approaches/<file>, version pinned)
approaches:
  - 08-editorial-diagrams   # v1 (ADR 0002)
  - 09-motion-explainer     # v1 (ADR 0002)

testcases:
  - codebase-structure   # v1
  - diffusion-variants   # v1
  - research-project     # v1
  - incident-analysis    # v1
  - tradeoff-decision    # v1
  - experiment-results   # v1

# One fresh subagent per cell; generator sees approach spec + contract +
# brief + source (never key_facts). Evaluator sees screenshots + html +
# key_facts + rubric (never the approach spec). Same models as baseline.
generator_model: claude-fable-5
evaluator_model: claude-fable-5
rubric: eval/rubric.md             # v1
contract: approaches/_contract.md  # v1

render:
  viewport: [1440, 900]
  browsers_path: /mnt/projects/.playwright-browsers

# git SHA of approaches/ + testcases/ at generation time — filled when
# generation starts.
inputs_sha: 97bd272
